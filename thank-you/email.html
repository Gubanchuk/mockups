<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You Page</title>
<style>
  @font-face { font-family: "Gotham Narrow"; src: url("/thank-you/assets/fonts/GothamNarrow-Black.d8117813.woff2") format("woff2"); font-weight: 900; font-style: normal; font-display: swap; }
  @font-face { font-family: "Gotham Narrow"; src: url("/thank-you/assets/fonts/GothamNarrow-Bold.4384608e.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
  @font-face { font-family: "Poppins"; src: url("/thank-you/assets/fonts/Poppins-Regular.581964a0.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Poppins"; src: url("/thank-you/assets/fonts/Poppins-Medium.0a448ffa.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: "Poppins"; src: url("/thank-you/assets/fonts/Poppins-Bold.31674544.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }

  :root {
    --ink: #183261;
    --blue: #1E5290;
    --blue-hover: #18467D;
    --muted: #4A5E80;
    --tint: #EDF6FF;
    --line: #D7E3F1;
    --footer: #0E2C56;
    --ok: #1F7A4D;
    --ok-tint: #EAF6EF;
    --bad: #B3261E;
    --bad-tint: #FCEEEE;
    --ground: #EFF8FF;
    --stage: #E6EAF0;
    --stage-ink: #4E5D72;
    --bezel: #141B26;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--stage); color: var(--ink); font: 400 16px/1.6 "Poppins", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: #CFE2F7; color: var(--ink); }
  img { display: block; max-width: 100%; }
  a { color: var(--blue); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* Mockup toolbar (same as the other YBG mockups) */
  .mock-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 20px; background: #16202e; color: #c7d2e1; font: 500 12px/1 "Poppins", Arial, sans-serif; }
  .mock-group { display: flex; align-items: center; gap: 8px; }
  .mock-group span { color: #8d9bb0; }
  .mock-seg { display: flex; background: #243142; border-radius: 6px; padding: 2px; }
  .mock-seg button { color: #c7d2e1; padding: 7px 10px; border-radius: 4px; }
  .mock-seg button:hover { color: #fff; }
  .mock-seg button[aria-pressed="true"] { background: #f3f6fb; color: #16202e; }

  /* Desktop: the page at the window width, as in a browser */
  body[data-screen="laptop"] .stage { display: block; padding: 0; }
  .device.device--page { display: block; width: 100%; margin: 0; }
  .page-root { background: #fff; }

  /* Stage with device frames */
  .stage { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 36px 48px; padding: 32px 24px 64px; }
  .device { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .device figcaption { font: 500 12px/1 "Poppins", Arial, sans-serif; color: var(--stage-ink); font-variant-numeric: tabular-nums; }
  .bezel { background: var(--bezel); box-shadow: 0 24px 48px -24px rgba(20, 27, 38, .55); }
  .device--phone .bezel { padding: 10px; border-radius: 38px; }
  .device--phone .screen { border-radius: 28px; }
  .device--laptop .bezel { padding: 14px 14px 18px; border-radius: 16px 16px 4px 4px; }
  .device--laptop .base { height: 14px; background: #2A3342; border-radius: 0 0 14px 14px; margin: 0 -40px; }
  .laptop-fit { transform-origin: top left; }
  .screen { position: relative; overflow: hidden; background: #fff; }
  .scroller { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; }
  .device--phone .scroller { scrollbar-width: none; }
  .device--phone .scroller::-webkit-scrollbar { display: none; }
  .device--laptop .scroller { scrollbar-width: thin; scrollbar-color: #B9CBE2 transparent; }
  body[data-solo="1"] .stage { padding: 0; gap: 0; }
  body[data-solo="1"] .device { gap: 0; }
  body[data-solo="1"] .device figcaption { display: none; }
  body[data-solo="1"] .bezel { padding: 0; border-radius: 0; background: none; box-shadow: none; }
  body[data-solo="1"] .screen { border-radius: 0; }

  /* Site header, as on the live program pages: a centred container, logo, menu, and for HESI the logged-out button */
  .site-head { background: #fff; border-bottom: 1px solid #DCE6F1; }
  .site-head-in { display: flex; align-items: center; gap: 56px; max-width: 980px; height: 80px; margin: 0 auto; padding: 0 12px; }
  .site-logo { height: 62px; width: auto; }
  .site-nav { display: flex; gap: 30px; font: 500 13px/1 "Poppins", Arial, sans-serif; color: #000; letter-spacing: .01em; }
  .site-btn { display: inline-flex; align-items: center; gap: 10px; height: 35px; margin-left: auto; padding: 0 14px; border-radius: 3px; background: var(--blue); color: #fff; font: 400 12px/1 "Poppins", Arial, sans-serif; text-decoration: none; white-space: nowrap; }
  .site-btn svg { width: 15px; height: 15px; }
  .burger { display: none; margin-left: auto; width: 32px; height: 32px; color: var(--blue); }
  .is-phone .site-head-in { height: 64px; padding: 0 16px; gap: 12px; }
  .is-phone .site-logo { height: 42px; }
  .is-phone .site-nav, .is-phone .site-btn { display: none; }
  .is-phone .burger { display: block; }

  /* Page: the site's pale ground with the content on one white sheet */
  .ground { background: var(--ground); padding: 40px 20px 56px; }
  .is-phone .ground { padding: 14px 10px 28px; }
  .ty { max-width: 860px; margin: 0 auto; padding: 48px 56px 52px; background: #fff; border-radius: 12px; box-shadow: 0 14px 34px -18px rgba(0, 0, 0, .28), 0 1px 3px rgba(0, 0, 0, .06); }
  .is-phone .ty { padding: 26px 18px 30px; border-radius: 10px; }
  .ty-title { margin: 0; font: italic 900 44px/1 "Gotham Narrow", Arial, sans-serif; color: var(--blue); letter-spacing: -.005em; }
  .is-phone .ty-title { font-size: 36px; }
  .ty-lead { margin: 14px 0 0; font-size: 18px; line-height: 1.55; color: var(--ink); max-width: 34em; }
  .is-phone .ty-lead { font-size: 16px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 6px; background: var(--blue); color: #fff; font: 700 16px/1.2 "Poppins", Arial, sans-serif; text-decoration: none; transition: background-color .15s; }
  .btn:hover { background: var(--blue-hover); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .is-phone .btn { width: 100%; padding: 0 14px; gap: 8px; font-size: 15px; }
  p { margin: 0; }
  .card-img { width: 100%; max-width: 360px; height: auto; }

  /* Claire's note closes the sheet */
  .note { margin-top: 40px; padding-top: 30px; border-top: 1px solid var(--line); }
  .is-phone .note { margin-top: 30px; padding-top: 24px; }
  .note p { font-size: 16px; line-height: 1.65; }
  .note p + p { margin-top: 12px; }
  .note .sign { margin-top: 18px; font: italic 900 26px/1.15 "Gotham Narrow", Arial, sans-serif; color: var(--blue); }
  .note .ps { font-size: 14px; color: var(--muted); }

  .help { margin-top: 22px; padding: 18px 20px; border-radius: 10px; background: var(--tint); font-size: 15px; line-height: 1.55; }
  .help b { font-weight: 700; }

  /* New versions (03.10): shared top with "When do we start?" */
  .v4 .top { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 0 40px; align-items: start; }
  .is-phone .v4 .top { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .is-phone .v4 .top .card-img { max-width: 210px; margin: 18px 0 0; }
  .v4 .top .card-img { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  .is-phone .v4 .top .card-img { grid-column: 1; grid-row: auto; }
  .when { margin: 26px 0 0; font: 700 23px/1.3 "Poppins", Arial, sans-serif; color: var(--ink); }
  .when span { color: var(--blue); }
  .is-phone .when { margin-top: 20px; font-size: 19px; }
  .when-sub { margin: 6px 0 0; font-size: 16px; line-height: 1.55; color: var(--muted); max-width: 34em; }
  .is-phone .when-sub { font-size: 15px; }
  /* Claire's line from the live page, in her voice (The email only) */
  .when-claire { margin: 8px 0 0; font-size: 17px; line-height: 1.5; font-style: italic; color: var(--ink); }
  .is-phone .when-claire { font-size: 16px; }

  /* The login email as an envelope: a picture of what is coming, not a piece of mail software */
  .env { position: relative; width: 100%; max-width: 340px; aspect-ratio: 340 / 250; margin: 0; transform: rotate(-2.5deg); cursor: default; }
  .env-back { position: absolute; left: 0; right: 0; top: 30%; bottom: 0; border-radius: 4px; background: var(--blue-hover); }
  /* the open flap stands up behind the letter */
  .env-flap { position: absolute; left: 0; right: 0; top: 0; height: 31%; background: var(--blue-hover); clip-path: polygon(0 100%, 50% 0, 100% 100%); }
  .env-letter { position: absolute; left: 7%; right: 7%; top: 11%; height: 58%; padding: 12px 14px; border-radius: 3px; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); animation: letter-up .9s cubic-bezier(.22, 1, .36, 1) .3s both; }
  .env-from { display: block; font-size: 12px; line-height: 1.4; color: var(--muted); }
  .env-subject { display: block; margin-top: 3px; font: 700 14px/1.35 "Poppins", Arial, sans-serif; color: var(--ink); }
  .env-front { position: absolute; left: 0; right: 0; top: 52%; bottom: 0; border-radius: 0 0 4px 4px; background: var(--blue); clip-path: polygon(0 0, 50% 40%, 100% 0, 100% 100%, 0 100%); }
  .env-front::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom right, transparent 49.6%, rgba(255, 255, 255, .14) 50%, transparent 50.6%), linear-gradient(to bottom left, transparent 49.6%, rgba(255, 255, 255, .14) 50%, transparent 50.6%); }
  @keyframes letter-up { from { transform: translateY(34%); } to { transform: translateY(0); } }
  .is-phone .env { max-width: 290px; }
  .is-phone .env-letter { padding: 10px 12px; }
  .is-phone .env-subject { font-size: 13px; }

  /* Step marks: a ring with the step number; they show the steps, they are not buttons.
     Poppins sits high in its line box, so the line is trimmed to the cap height and the glyph itself is centred */
  .mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--blue); background: #fff; color: var(--blue); font: 700 15px/1 "Poppins", Arial, sans-serif; font-variant-numeric: tabular-nums; }
  .mark > span, .qz-letter > span { text-box: trim-both cap alphabetic; }
  /* Poppins figures sit a touch above the cap line centre */
  .mark > span { translate: 0 .06em; }
  .step-title { margin: 4px 0 0; font: 700 20px/1.3 "Poppins", Arial, sans-serif; color: var(--ink); }
  .is-phone .step-title { font-size: 18px; }
  .step-text { margin-top: 6px; font-size: 15px; line-height: 1.6; color: var(--muted); }

  /* Version Try a question: one real course question to answer while the login email is on its way; the two steps sit beside it */
  .ground:has(.v-quiz) { padding-top: 28px; }
  .is-phone .ground:has(.v-quiz) { padding-top: 14px; }
  .v-quiz { padding-top: 36px; }
  .is-phone .v-quiz { padding-top: 26px; }
  .v-quiz .ty-lead { max-width: none; margin-top: 10px; text-wrap: balance; }
  .v-quiz .when { margin-top: 16px; }
  .v-quiz .when-sub { text-wrap: balance; }
  .is-phone .v-quiz .ty-lead, .is-phone .v-quiz .when-sub { text-wrap: wrap; }
  .v-quiz .when-sub { max-width: none; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 0 28px; align-items: start; margin-top: 16px; }
  .is-phone .split { grid-template-columns: minmax(0, 1fr); margin-top: 18px; }
  .quiz { padding: 20px 24px 24px; border-radius: 12px; background: var(--tint); }
  .is-phone .quiz { padding: 20px 16px 22px; }
  .qz-q { margin-top: 0; font-size: 15.5px; line-height: 1.55; color: var(--ink); }
  .qz-q u { text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
  .qz-opts { list-style: none; display: grid; gap: 6px; margin: 14px 0 0; padding: 0; }
  .qz-opt { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font: 400 15px/1.45 "Poppins", Arial, sans-serif; text-align: left; transition: border-color .15s, background-color .15s; }
  .qz-opt:hover:not(:disabled) { border-color: var(--blue); }
  .qz-opt:disabled { cursor: default; }
  .qz-letter { display: grid; place-items: center; width: 28px; height: 28px; border: 1.5px solid var(--blue); border-radius: 50%; color: var(--blue); font: 700 13px/1 "Poppins", Arial, sans-serif; }
  .qz-opt.is-correct { border-color: var(--ok); background: var(--ok-tint); }
  .qz-opt.is-correct .qz-letter { border-color: var(--ok); background: var(--ok); color: #fff; }
  .qz-opt.is-wrong { border-color: var(--bad); background: var(--bad-tint); }
  .qz-opt.is-wrong .qz-letter { border-color: var(--bad); background: var(--bad); color: #fff; }
  /* the course's own explanation, opened after the answer */
  .qz-feedback { margin-top: 16px; font-size: 15px; line-height: 1.6; color: var(--ink); animation: qz-open .35s cubic-bezier(.22, 1, .36, 1) both; }
  .qz-feedback[hidden] { display: none; }
  .qz-feedback p + p { margin-top: 10px; }
  .qz-verdict { font: 700 17px/1.3 "Poppins", Arial, sans-serif; }
  .qz-verdict.is-right { color: var(--ok); }
  /* a wrong pick right after paying should not sting: the option shows red, the words stay calm */
  .qz-verdict.is-off { color: var(--ink); }
  .qz-feedback .qz-more { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 15px; font-weight: 500; color: var(--ink); text-wrap: balance; }
  @keyframes qz-open { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  /* the two steps in a narrow column beside the question */
  .rail { list-style: none; display: grid; gap: 24px; margin: 0; padding: 0; }
  .is-phone .rail-col { margin-top: 26px; padding-top: 24px; border-top: 1px solid var(--line); }
  .step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-content: start; }
  .rail .mark { width: 30px; height: 30px; font-size: 14px; }
  .rail .step-title { margin-top: 3px; font-size: 16px; }
  .rail .step-text { font-size: 14px; line-height: 1.55; }
  .page-root .rail .btn { width: 100%; min-height: 46px; margin-top: 12px; padding: 0 16px; font-size: 15px; }
  /* the email described in words: who sends it and its exact subject */
  .mail-id { margin: 8px 0 0; font-size: 13px; line-height: 1.45; }
  .mail-id dt { color: var(--muted); }
  .mail-id dd { margin: 0 0 6px; color: var(--ink); font-weight: 500; }
  /* if the email is not there: right after "Got your email? Log in" */
  .rail-help { margin: 18px 0 0 42px; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .rail-help b { color: var(--ink); font-weight: 700; }
  /* Claire's real signature under "See you inside!" */
  .note .sign-img { display: block; height: 40px; width: auto; margin-top: 8px; }
  .note .sign-img + .ps { margin-top: 16px; }
  .plan { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 32px; margin: 18px 0 0; padding: 0; }
  .is-phone .plan { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .plan li { padding-top: 12px; border-top: 2px solid var(--line); }
  .plan b { display: block; font: 700 16px/1.35 "Poppins", Arial, sans-serif; color: var(--ink); }
  .plan span { display: block; margin-top: 4px; font-size: 15px; line-height: 1.55; color: var(--muted); }
  .also { margin-top: 18px; font-size: 15px; line-height: 1.55; color: var(--muted); }
  .also b { color: var(--ink); font-weight: 700; }

  .page-root .v4 .btn { white-space: nowrap; }

  /* Version The email */
  .mail-step { display: grid; grid-template-columns: minmax(0, 1fr) 320px; grid-template-areas: "text env" "help env"; gap: 0 32px; align-items: start; margin-top: 34px; padding-top: 30px; border-top: 1px solid var(--line); }
  .is-phone .mail-step { grid-template-columns: minmax(0, 1fr); grid-template-areas: "text" "env" "help"; margin-top: 28px; padding-top: 24px; }
  .mail-step-text { grid-area: text; }
  .mail-step .env { grid-area: env; margin-top: 10px; }
  .is-phone .mail-step .env { margin-top: 18px; }
  .mail-step .help { grid-area: help; margin-top: 18px; }
  .step-text b { color: var(--ink); font-weight: 500; }
  .next-step { margin-top: 30px; padding-top: 28px; border-top: 1px solid var(--line); }
  .is-phone .next-step { margin-top: 26px; padding-top: 22px; }
  .next-step .btn { margin-top: 16px; }

  /* Footers, as on the live program pages */
  .foot-light { padding: 30px 24px 40px; background: #fff; text-align: center; font: 400 12px/1.6 Arial, sans-serif; color: #000; }
  .foot-light nav { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 0; margin-bottom: 14px; font: 700 14px/1 Arial, sans-serif; }
  .foot-light nav a { color: #0B5CB5; padding: 0 16px; }
  .foot-light nav a + a { border-left: 1px solid #D3D9E2; }
  .is-phone .foot-light nav { gap: 12px 0; }
  .is-phone .foot-light nav a:nth-child(3) { flex-basis: 100%; border-left: 0; }
  .foot-dark { padding: 34px 20px 40px; background: var(--footer); color: #fff; font: 400 13px/1.6 "Poppins", Arial, sans-serif; }
  .foot-dark-in { display: grid; grid-template-columns: auto 1fr auto; gap: 28px 40px; align-items: start; max-width: 980px; margin: 0 auto; padding: 0 12px; }
  .is-phone .foot-dark-in { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .foot-dark .seal { height: 62px; width: auto; }
  .foot-dark nav { display: grid; grid-template-columns: repeat(3, auto); justify-content: center; gap: 12px 44px; font-weight: 600; }
  .is-phone .foot-dark nav { gap: 12px 22px; }
  .foot-dark nav a { color: #fff; text-decoration: none; }
  .social { display: flex; gap: 10px; }
  .social a { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 20px; color: #fff; }
  .social a svg { width: 20px; height: 20px; }
  .social .fb { background: #3B5998; }
  .social .tw { background: #1DA1F2; }
  .foot-dark .copy .ln { display: block; }
  .is-phone .foot-dark .copy .ln { display: inline; }
  .foot-dark .copy { grid-column: 1 / -1; margin-top: 18px; text-align: center; color: #7E9AC1; font-size: 12px; line-height: 1.6; }
  .is-phone .foot-dark .copy p + p { margin-top: 8px; }
  .is-phone .foot-dark .copy .copy-main { font-size: 14px; }

  @media (max-width: 719px) {
    .mock-bar { padding: 10px 12px; gap: 8px 12px; }
    .mock-group, .mock-seg { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
<style>
  .mock-version { color: #c7d2e1; text-decoration: none; white-space: nowrap; }
  .mock-version:hover { color: #ffffff; }
  .mock-version-name { color: #ffffff; font-weight: 600; white-space: nowrap; margin-right: 8px; }
  @media (max-width: 767px) { .mock-version-name { white-space: normal; } }
</style>
</head>
<body data-version="mail" data-program="a2" data-screen="laptop">

<div class="mock-bar" role="toolbar" aria-label="Mockup options">
  <a class="mock-version" href="/thank-you">&larr; Thank You page</a><span class="mock-version-name">Version 1 &middot; The email</span>
  <div class="mock-group"><span>Program</span>
    <div class="mock-seg" data-key="program">
      <button data-value="a2">HESI A2 Masterclass</button>
      <button data-value="hesi">HESI Exam Study</button>
    </div>
  </div>
  <div class="mock-group"><span>Screen</span>
    <div class="mock-seg" data-key="screen">
      <button data-value="laptop">Desktop</button>
      <button data-value="phone">Phone</button>
    </div>
  </div>
</div>

<main class="stage" id="stage"></main>

<script>
(function () {
  var ICON = {
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',

  // The answer opens the course's own explanation: for the chosen option and, when it is wrong, for the right one

      ? '<p class="qz-verdict is-right">Correct!</p><p>' + Q.why[i] + '</p>'
      : '<p class="qz-verdict is-off">Good try!</p><p>' + Q.why[i] + '</p><p><b>The answer is ' + L.charAt(c) + '.</b> ' + Q.why[c] + '</p>') +

  function Device(opts) {
    this.kind = opts.kind;
    if (this.kind === 'page') {
      this.el = document.createElement('div');
      this.el.className = 'device device--page';
      this.scroller = document.createElement('div');
      this.scroller.className = 'page-root';
      this.el.appendChild(this.scroller);
      this.el.addEventListener('click', function (e) { if (e.target.closest('a, button')) e.preventDefault(); });
      return;
    }
    this.width = opts.width;
    this.height = opts.height;
    this.solo = !!opts.solo;
    var fig = document.createElement('figure');
    fig.className = 'device device--' + this.kind;
    this.el = fig;
    var bezel = document.createElement('div');
    bezel.className = 'bezel';
    var screen = document.createElement('div');
    screen.className = 'screen';
    this.scroller = document.createElement('div');
    this.scroller.className = 'scroller' + (this.kind === 'phone' ? ' is-phone' : '');
    screen.appendChild(this.scroller);
    bezel.appendChild(screen);
    var w = this.kind === 'laptop' ? 1280 : this.width, h = this.kind === 'laptop' ? 800 : this.height;
    screen.style.width = w + 'px';
    screen.style.height = h + 'px';
    if (this.kind === 'laptop') {
      this.fit = document.createElement('div');
      this.fit.className = 'laptop-fit';
      this.fit.appendChild(bezel);
      var base = document.createElement('div');
      base.className = 'base';
      this.fit.appendChild(base);
      this.fitWrap = document.createElement('div');
      this.fitWrap.appendChild(this.fit);
      fig.appendChild(this.fitWrap);
    } else {
      fig.appendChild(bezel);
    }
    var cap = document.createElement('figcaption');
    cap.textContent = w + ' × ' + h;
    fig.appendChild(cap);
    // The mockup does not leave the page: links and buttons inside the screens stay put
    fig.addEventListener('click', function (e) { if (e.target.closest('a, button')) e.preventDefault(); });
  }
  Device.prototype.render = function (version, program) { this.scroller.innerHTML = page(version, program); };
  Device.prototype.scale = function () {
    if (this.kind !== 'laptop') return;
    var full = 1280 + 28;
    var room = Math.min(stage.clientWidth - 48, window.innerWidth - 48);
    var k = Math.min(1, room / full);
    this.fit.style.transform = 'scale(' + k + ')';
    this.fitWrap.style.width = Math.round(full * k) + 'px';
    this.fitWrap.style.height = Math.round((800 + 32 + 14) * k) + 'px';
  };

  function readHash() {
    var out = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (pair) {
      var kv = pair.split('=');
      if (kv[0]) out[kv[0]] = decodeURIComponent(kv[1] || '');
    });
    return out;
  }

  var devices = [];
  function mount() {
    var h = readHash();
    ['program', 'screen'].forEach(function (k) { if (h[k]) body.dataset[k] = h[k]; });
    var solo = h.solo === '1' || window.innerWidth < 720;
    body.dataset.solo = solo ? '1' : '0';
    if (solo) body.dataset.screen = 'phone';
    document.querySelectorAll('.mock-seg').forEach(function (seg) {
      seg.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.value === body.dataset[seg.dataset.key])); });
    });
    stage.innerHTML = '';
    devices = [];
    if (solo) {
      var barH = document.querySelector('.mock-bar').offsetHeight;
      devices.push(new Device({ kind: 'phone', width: window.innerWidth, height: window.innerHeight - barH, solo: true }));
    } else if (body.dataset.screen === 'laptop') {
      devices.push(new Device({ kind: 'page' }));
    } else {
      devices.push(new Device({ kind: 'phone', width: 390, height: PHONE_H }), new Device({ kind: 'phone', width: 446, height: PHONE_H }));
    }
    devices.forEach(function (d) { stage.appendChild(d.el); d.scale(); d.render(body.dataset.version, body.dataset.program); });
  }

  function go(key, value) {
    var h = readHash();
    ['program', 'screen'].forEach(function (k) { if (!h[k]) h[k] = body.dataset[k]; });
    h[key] = value;
    history.replaceState(null, '', '#' + KEYS.filter(function (k) { return h[k]; }).map(function (k) { return k + '=' + h[k]; }).join('&'));
    mount();
  }

  document.querySelectorAll('.mock-seg button').forEach(function (b) {
    b.addEventListener('click', function () { go(b.parentElement.dataset.key, b.dataset.value); });
  });
  // A click on an answer in the practice question (works in every device frame)
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.qz-opt');
    if (!b || b.disabled) return;
    answer(b.closest('.quiz'), +b.getAttribute('data-i'));
  });
  window.addEventListener('hashchange', mount);
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var soloNow = window.innerWidth < 720 || readHash().solo === '1';
      if (soloNow !== (body.dataset.solo === '1')) { mount(); return; }
      devices.forEach(function (d) { d.scale(); });
    }, 150);
  });

  var fontsReady = document.fonts && document.fonts.load
    ? Promise.all(['italic 900 44px "Gotham Narrow"', '400 16px Poppins', '500 16px Poppins', '700 16px Poppins'].map(function (f) { return document.fonts.load(f); })).catch(function () {})
    : Promise.resolve();
  fontsReady.then(mount);
})();
