<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank You Page, simple versions</title>
<style>
  @font-face { font-family: "Gotham Narrow"; src: url("/thank-you/assets/fonts/GothamNarrow-Black.d8117813.woff2") format("woff2"); font-weight: 900; font-style: normal; font-display: swap; }
  @font-face { font-family: "Poppins"; src: url("/thank-you/assets/fonts/Poppins-Regular.581964a0.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Poppins"; src: url("/thank-you/assets/fonts/Poppins-Medium.0a448ffa.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: "Poppins"; src: url("/thank-you/assets/fonts/Poppins-Bold.31674544.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }

  :root {
    --ink: #183261;
    --blue: #1E5290;
    --blue-hover: #18467D;
    --muted: #4A5E80;
    --line: #D7E3F1;
    --tint: #EDF6FF;
    --footer: #0E2C56;
    --ground: #EFF8FF;
    --stage: #E6EAF0;
    --stage-ink: #4E5D72;
    --bezel: #141B26;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--stage); color: var(--ink); font: 400 16px/1.6 "Poppins", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: #CFE2F7; color: var(--ink); }
  img { display: block; max-width: 100%; }
  a { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 3px; transition: color .15s; }
  a:hover { color: var(--blue-hover); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  p, h1, h2, dl, dd { margin: 0; }

  /* Mockup toolbar (same as the other YBG mockups) */
  .mock-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 20px; background: #16202e; color: #c7d2e1; font: 500 12px/1 "Poppins", Arial, sans-serif; }
  .mock-group { display: flex; align-items: center; gap: 8px; }
  .mock-group span { color: #8d9bb0; }
  .mock-group[hidden] { display: none; }
  .mock-seg { display: flex; background: #243142; border-radius: 6px; padding: 2px; }
  .mock-seg button { color: #c7d2e1; padding: 7px 10px; border-radius: 4px; }
  .mock-seg button:hover { color: #fff; }
  .mock-seg button[aria-pressed="true"] { background: #f3f6fb; color: #16202e; }

  /* Desktop: the page at the window width, as in a browser */
  body[data-screen="laptop"] .stage { display: block; padding: 0; }
  .device.device--page { display: block; width: 100%; margin: 0; }
  .page-root { background: #fff; }

  /* Stage with phone frames */
  .stage { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 36px 48px; padding: 32px 24px 64px; }
  .device { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .device figcaption { font: 500 12px/1 "Poppins", Arial, sans-serif; color: var(--stage-ink); font-variant-numeric: tabular-nums; }
  .bezel { background: var(--bezel); box-shadow: 0 24px 48px -24px rgba(20, 27, 38, .55); }
  .device--phone .bezel { padding: 10px; border-radius: 38px; }
  .device--phone .screen { border-radius: 28px; }
  .screen { position: relative; overflow: hidden; background: #fff; }
  .scroller { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .scroller::-webkit-scrollbar { display: none; }
  body[data-solo="1"] .stage { padding: 0; gap: 0; }
  body[data-solo="1"] .device { gap: 0; }
  body[data-solo="1"] .device figcaption { display: none; }
  body[data-solo="1"] .bezel { padding: 0; border-radius: 0; background: none; box-shadow: none; }
  body[data-solo="1"] .screen { border-radius: 0; }

  /* Site header, as on the live program pages */
  .site-head { background: #fff; border-bottom: 1px solid #DCE6F1; }
  .site-head-in { display: flex; align-items: center; gap: 56px; max-width: 980px; height: 80px; margin: 0 auto; padding: 0 12px; }
  .site-logo { height: 62px; width: auto; }
  .site-nav { display: flex; gap: 30px; font: 500 13px/1 "Poppins", Arial, sans-serif; color: #000; letter-spacing: .01em; }
  .site-btn { display: inline-flex; align-items: center; gap: 10px; height: 35px; margin-left: auto; padding: 0 14px; border-radius: 3px; background: var(--blue); color: #fff; font: 400 12px/1 "Poppins", Arial, sans-serif; text-decoration: none; white-space: nowrap; }
  .site-btn:hover { color: #fff; background: var(--blue-hover); }
  .site-btn svg { width: 15px; height: 15px; }
  .burger { display: none; margin-left: auto; width: 32px; height: 32px; color: var(--blue); }
  .is-phone .site-head-in { height: 64px; padding: 0 16px; gap: 12px; }
  .is-phone .site-logo { height: 42px; }
  .is-phone .site-nav, .is-phone .site-btn { display: none; }
  .is-phone .burger { display: block; }

  /* Page: the site's pale ground with the content on one white sheet */
  .ground { background: var(--ground); padding: 48px 20px 64px; }
  .is-phone .ground { padding: 14px 10px 28px; }
  .ty { margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 14px 34px -18px rgba(0, 0, 0, .28), 0 1px 3px rgba(0, 0, 0, .06); }
  .is-phone .ty { border-radius: 10px; }
  .ty-title { font: italic 900 44px/1 "Gotham Narrow", Arial, sans-serif; color: var(--blue); letter-spacing: -.005em; }
  .is-phone .ty-title { font-size: 36px; }
  .ty-lead { margin-top: 16px; font-size: 18px; line-height: 1.55; text-wrap: pretty; }
  .is-phone .ty-lead { margin-top: 12px; font-size: 16px; }
  .sign { font: italic 900 26px/1.15 "Gotham Narrow", Arial, sans-serif; color: var(--blue); }
  .sign-img { height: 40px; width: auto; margin-top: 8px; }
  /* the email described in words: who sends it and its exact subject */
  .mail-id { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 15px; line-height: 1.45; }
  .mail-id dt { color: var(--muted); }
  .mail-id dd { font-weight: 500; overflow-wrap: anywhere; }
  .quiet { color: var(--muted); }

  /* Version Sections: the same letter, each part named on the left */
  .v-letter { max-width: 820px; padding: 52px 64px 56px; }
  .is-phone .v-letter { padding: 28px 20px 30px; }
  .v-letter .ty-lead { max-width: 30em; }
  .when { margin-top: 30px; font: 700 22px/1.3 "Poppins", Arial, sans-serif; }
  /* Sections: "When do we start?" and what waits inside, set apart on the site's pale blue */
  .start { margin-top: 30px; padding: 26px 30px 28px; border-radius: 12px; background: var(--tint); }
  .is-phone .start { margin-top: 24px; padding: 20px 18px 22px; border-radius: 10px; }
  .start .when { margin-top: 0; font-size: 23px; }
  .is-phone .start .when { margin-top: 0; font-size: 19px; }
  .start .when-text { margin-top: 10px; font-size: 17px; line-height: 1.65; max-width: 36em; }
  .is-phone .start .when-text { font-size: 15px; }
  .when span { color: var(--blue); white-space: nowrap; }
  .is-phone .when { margin-top: 24px; font-size: 19px; }
  .when-text { margin-top: 8px; font-size: 16px; line-height: 1.65; max-width: 34em; text-wrap: pretty; }
  .is-phone .when-text { font-size: 15px; }
  .parts { margin-top: 30px; }
  .start + .parts .part:first-child { border-top: 0; padding-top: 6px; }
  .is-phone .parts { margin-top: 28px; }
  .part { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 0 28px; padding: 24px 0; border-top: 1px solid var(--line); }
  .is-phone .part { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 20px 0; }
  .part-title { font: 700 16px/1.5 "Poppins", Arial, sans-serif; text-wrap: balance; }
  .part-body { font-size: 16px; line-height: 1.65; text-wrap: pretty; }
  .is-phone .part-body { font-size: 15px; }
  .part-body > * + * { margin-top: 12px; }
  .part-body .mail-id { margin-top: 14px; }
  .part-body .quiet { font-size: 15px; }
  .close { padding-top: 28px; border-top: 1px solid var(--line); }
  .is-phone .close { padding-top: 24px; }
  .close-text { font-size: 16px; line-height: 1.65; max-width: 34em; text-wrap: pretty; }
  .close .sign { margin-top: 18px; }
  .ps { margin-top: 18px; font-size: 14px; line-height: 1.6; color: var(--muted); }

  /* Member card, only when the Card switch shows one: beside the title in Sections, top right in Original, updated */
  .card-img { display: block; width: 100%; height: auto; animation: card-in .25s ease-out both; }
  @keyframes card-in { from { opacity: 0; } to { opacity: 1; } }
  .v-letter.has-card .letter-top { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 0 36px; align-items: center; }
  .is-phone .v-letter.has-card .letter-top { grid-template-columns: minmax(0, 1fr); }
  .v-letter .letter-top .card-img { max-width: 300px; }
  .is-phone .v-letter .letter-top .card-img { grid-row: 1; max-width: 260px; margin-bottom: 20px; }

  /* Version "Original, updated": the live page's letter as it was, part headings above the text, the card top right */
  /* sheet as wide as on the live page: 800px, text column about 704px */
  .v-orig { max-width: 800px; padding: 52px 48px 56px; }
  .is-phone .v-orig { padding: 28px 20px 30px; }
  /* as on the live page, the text flows beside the card and continues under it; one right edge for text, card, line and P.S. */
  .orig-top::after { content: ""; display: block; clear: both; }
  .v-orig .orig-top .card-img { float: right; width: 320px; margin: 2px 0 18px 28px; }
  .is-phone .v-orig .orig-top .card-img { float: none; width: 100%; max-width: 260px; margin: 0 0 20px; }
  .v-orig .ty-lead { max-width: 30em; text-wrap: balance; }
  .v-orig .when { clear: right; }
  .orig-p { margin-top: 10px; font-size: 16px; line-height: 1.7; text-wrap: pretty; }
  .is-phone .orig-p { font-size: 15px; }
  .before { margin-top: 26px; }
  .orig-sec { margin-top: 26px; }
  .is-phone .orig-sec { margin-top: 22px; }
  .orig-h { font: 700 17px/1.4 "Poppins", Arial, sans-serif; color: var(--ink); text-wrap: balance; }
  .orig-sec .orig-p { margin-top: 6px; }
  .orig-sec .mail-id { margin-top: 12px; }
  .orig-close { margin-top: 34px; padding-top: 28px; border-top: 1px solid var(--line); }
  .orig-close .sign { margin-top: 0; }

  /* Footers, as on the live program pages */
  .foot-light { padding: 30px 24px 40px; background: #fff; text-align: center; font: 400 12px/1.6 Arial, sans-serif; color: #000; }
  .foot-light nav { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 0; margin-bottom: 14px; font: 700 14px/1 Arial, sans-serif; }
  .foot-light nav a { color: #0B5CB5; padding: 0 16px; }
  .foot-light nav a + a { border-left: 1px solid #D3D9E2; }
  .is-phone .foot-light nav { gap: 12px 0; }
  .is-phone .foot-light nav a:nth-child(3) { flex-basis: 100%; border-left: 0; }
  .foot-dark { padding: 34px 20px 40px; background: var(--footer); color: #fff; font: 400 13px/1.6 "Poppins", Arial, sans-serif; }
  .foot-dark-in { display: grid; grid-template-columns: auto 1fr auto; gap: 28px 40px; align-items: start; max-width: 980px; margin: 0 auto; padding: 0 12px; }
  .is-phone .foot-dark-in { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .foot-dark .seal { height: 62px; width: auto; }
  .foot-dark nav { display: grid; grid-template-columns: repeat(3, auto); justify-content: center; gap: 12px 44px; font-weight: 600; }
  .is-phone .foot-dark nav { gap: 12px 22px; }
  .foot-dark nav a { color: #fff; text-decoration: none; }
  .social { display: flex; gap: 10px; }
  .social a { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 20px; color: #fff; }
  .social a svg { width: 20px; height: 20px; }
  .social .fb { background: #3B5998; }
  .social .tw { background: #1DA1F2; }
  .foot-dark .copy .ln { display: block; }
  .is-phone .foot-dark .copy .ln { display: inline; }
  .foot-dark .copy { grid-column: 1 / -1; margin-top: 18px; text-align: center; color: #7E9AC1; font-size: 12px; line-height: 1.6; }
  .is-phone .foot-dark .copy p + p { margin-top: 8px; }
  .is-phone .foot-dark .copy .copy-main { font-size: 14px; }

  /* Desktop page in a narrow window: the letter parts stack */
  @media (max-width: 900px) {
    .page-root .part { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  }
  @media (max-width: 719px) {
    .mock-bar { padding: 10px 12px; gap: 8px 12px; }
    .mock-group, .mock-seg { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>
<style>
  .mock-version { color: #c7d2e1; text-decoration: none; white-space: nowrap; }
  .mock-version:hover { color: #ffffff; }
  .mock-version-name { color: #ffffff; font-weight: 600; white-space: nowrap; margin-right: 8px; }
  @media (max-width: 767px) { .mock-version-name { white-space: normal; } }
</style>
</head>
<body data-version="original" data-program="a2" data-screen="laptop" data-card="light">

<div class="mock-bar" role="toolbar" aria-label="Mockup options">
  <a class="mock-version" href="/thank-you">&larr; Thank You page</a><span class="mock-version-name">Version 1 &middot; Original, updated</span>
  <div class="mock-group mock-group--card"><span>Card</span>
    <div class="mock-seg" data-key="card"></div>
  </div>
  <div class="mock-group"><span>Program</span>
    <div class="mock-seg" data-key="program">
      <button data-value="a2">HESI A2 Masterclass</button>
      <button data-value="hesi">HESI Exam Study</button>
    </div>
  </div>
  <div class="mock-group"><span>Screen</span>
    <div class="mock-seg" data-key="screen">
      <button data-value="laptop">Desktop</button>
      <button data-value="phone">Phone</button>
    </div>
  </div>
</div>

<main class="stage" id="stage"></main>

<script>
(function () {
  var ICON = {
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    burger: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 9h22M5 16h22M5 23h22"/></svg>',
    fb: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.5 1.5-1.5h1.6V4.4c-.3 0-1.2-.1-2.3-.1-2.3 0-3.8 1.4-3.8 3.9v2.3H8v3h2.5V21h3z"/></svg>',
    tw: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 6.8c-.7.3-1.4.5-2.1.6.8-.5 1.3-1.2 1.6-2-.7.4-1.5.7-2.3.9a3.6 3.6 0 0 0-6.2 3.3A10.3 10.3 0 0 1 4.5 5.8a3.6 3.6 0 0 0 1.1 4.8c-.6 0-1.2-.2-1.6-.4 0 1.8 1.2 3.3 2.9 3.6-.5.1-1.1.2-1.6.1.5 1.4 1.8 2.5 3.4 2.5A7.3 7.3 0 0 1 3 17.9a10.3 10.3 0 0 0 5.6 1.6c6.7 0 10.4-5.6 10.4-10.4v-.5c.8-.5 1.4-1.2 2-1.8z"/></svg>'
  };
  // Facts of each program, from the live pages (reference/texts.md) and the login emails of test purchases on beta
  var P = {
    a2: {
      logo: '/thank-you/assets/a2-logo.png', logoAlt: 'Your Best Grade, HESI A2 Masterclass',
      nav: ['PRICING', 'FAQ', 'PREVIEW'], member: null,
      key: 'a2', cardAlt: 'HESI A2 Masterclass member card',
      exam: 'HESI A2 Exam', we: 'I',
      program: 'the A2 Masterclass',
      choosing: 'choosing the A2 Masterclass',
      // what the buyer will do inside: the A2 member area has video lessons with short quizzes and practice tests (/a2/members)
      training: 'The training begins immediately, so you have enough time to go through all the A2 Masterclass video lessons, quizzes and practice tests.',
      portal: 'where the whole A2 Masterclass is',
      ps: 'P.S. Don’t forget: the practice starts whenever you want, so be sure to make time to get started with the lessons!',
      loginUrl: 'yourbestgrade.com/a2/login',
      mail: { from: 'Your Best Grade Support', subject: '[HESI A2 MasterClass] Portal Login Credentials' },
      foot: 'light'
    },
    hesi: {
      logo: '/thank-you/assets/header__logo.webp', logoAlt: 'Your Best Grade, HESI Exam Study',
      nav: ['PRICING', 'FAQ', 'ABOUT US'], member: "Member's Login",
      key: 'hesi', cardAlt: 'HESI Exam Study member card',
      exam: 'HESI Exit Exam', we: 'we',
      program: 'HESI Exam Study',
      choosing: 'choosing to become a HESI Exam Study Insider',
      training: 'The training begins immediately, so you have enough time to read through our HESI Exam Review Guide and practice with all the HESI practice questions.',
      portal: 'where all the HESI practice is',
      ps: 'P.S. Don’t forget: the practice starts whenever you want, so be sure to make time to read the materials and get started!',
      loginUrl: 'yourbestgrade.com/hesi/login',
      mail: { from: 'info@yourbestgrade.com', subject: '[HESI Insider] Portal Login Credentials' },
      foot: 'dark'
    }
  };

  // Member card options for the Card switch. "none" is the page without a card; the others are modern cards per program
  // Generated in ChatGPT from the program logo and the old card, 10.10.2026 (prompts: reference/card-prompts.md, sources: reference/cards-source/)
  var CARDS = [
    { id: 'light', label: 'Light', a2: '/thank-you/assets/cards/card-a2-light.png', hesi: '/thank-you/assets/cards/card-hesi-light.png' },
    { id: 'navy', label: 'Navy', a2: '/thank-you/assets/cards/card-a2-navy.png', hesi: '/thank-you/assets/cards/card-hesi-navy.png' },
    // the card from the live Thank You pages, as it is now
    { id: 'original', label: 'Original', a2: '/thank-you/assets/a2_masterclass_member_card.jpeg', hesi: '/thank-you/assets/hesi_exam_study_member_card.jpeg' },
    { id: 'none', label: 'No card' }
  ];

  var body = document.body;
  var stage = document.getElementById('stage');
  var KEYS = ['program', 'card', 'screen', 'solo'];
  var PHONE_H = 705;
  var SUPPORT = '<a href="#">support@yourbestgrade.com</a>';

  function header(p) {
    return '<header class="site-head"><div class="site-head-in"><img class="site-logo" src="' + p.logo + '" alt="' + p.logoAlt + '">' +
      '<nav class="site-nav" aria-label="Site">' + p.nav.map(function (n) { return '<span>' + n + '</span>'; }).join('') + '</nav>' +
      (p.member ? '<a class="site-btn" href="#">' + p.member + ICON.arrow + '</a>' : '') +
      '<button class="burger" aria-label="Menu">' + ICON.burger + '</button></div></header>';
  }

  function footer(p) {
    if (p.foot === 'dark') {
      return '<footer class="foot-dark"><div class="foot-dark-in"><img class="seal" src="/thank-you/assets/footerlogo1.webp" alt="Norton Secured, powered by DigiCert">' +
        '<nav aria-label="Footer"><a href="#">About</a><a href="#">Register</a><a href="#">Terms and Conditions</a><a href="#">FAQs</a><a href="#">Login</a><a href="#">Privacy Policy</a></nav>' +
        '<div class="social"><a class="fb" href="#" aria-label="Facebook">' + ICON.fb + '</a><a class="tw" href="#" aria-label="Twitter">' + ICON.tw + '</a></div>' +
        '<div class="copy"><p class="copy-main"><span class="ln">Copyright © 2026 Your Best Grade, Inc. All Rights Reserved. </span></p><p><span class="ln">*We utilize surveys to measure the effectiveness of our program. Our latest results show that over 90% of customers </span><span class="ln">who responded to our surveys and reported to have taken the HESI Exit since joining, passed their exam. </span></p><p><span class="ln">**Please see the full terms and conditions of the success guarantee on our Pricing page. </span></p><p><span class="ln">HESI is a registered trademark of Elsevier, Inc., creator and owner of the official HESI Examinations and Review Materials. </span><span class="ln">Elsevier is not involved in the production of, and does not endorse, this website or its content. </span></p></div></div></footer>';
    }
    return '<footer class="foot-light"><nav aria-label="Footer"><a href="#">Terms and Conditions</a><a href="#">Privacy Policy</a><a href="#">support@yourbestgrade.com</a></nav>' +
      '<p>© 2026 Your Best Grade, Inc. All Rights Reserved.</p>' +
      '<p>HESI ® is a registered trademark of Elsevier Inc. NCLEX ® is a registered trademark of the NCSBN, Inc.</p></footer>';
  }

  function lead(p) {
    return 'I’m so glad you’re as confident as I am that ' + p.we + ' can help you succeed on the ' + p.exam + '!';
  }
  function mailId(p) {
    return '<dl class="mail-id"><dt>From</dt><dd>' + p.mail.from + '</dd><dt>Subject</dt><dd>' + p.mail.subject + '</dd></dl>';
  }
  function signImg() {
    return '<img class="sign-img" src="/thank-you/assets/course/claire-signature.png" alt="Claire">';
  }

  // Version 1: the live page's letter, in its own order, shorter and without the caps
  function cardImg(p, card) {
    var c = cardOf(card);
    return c && c[p.key] ? '<img class="card-img" src="' + c[p.key] + '" alt="' + p.cardAlt + '">' : '';
  }
  function cardOf(id) {
    for (var i = 0; i < CARDS.length; i++) if (CARDS[i].id === id) return CARDS[i];
    return null;
  }

  var PACE = 'Go through it all at your own study pace. I want you to have the BEST experience possible.&nbsp;:)';
  function emailText(p) {
    return 'Within 60 minutes, usually sooner, you’ll get an email from me with everything you need to access the private portal ' + p.portal + ':';
  }
  function helpText(p) {
    return 'If you don’t get your email, or have any other issue at all with ' + p.program + ', please contact Customer Support: ' + SUPPORT;
  }
  function thanksText(p) {
    return 'That’s it for now. Thank you again for ' + p.choosing + ', and I look forward to helping you prepare for your exam!';
  }

  // Version Original, updated: the live page's letter in its own order and headings, shorter, without the caps
  function vOriginal(p, card) {
    var img = cardImg(p, card);
    return '<article class="ty v-orig' + (img ? ' has-card' : '') + '">' +
      '<div class="orig-top">' + img + '<h1 class="ty-title">THANK YOU!</h1>' +
        '<p class="ty-lead">' + lead(p) + '</p>' +
        '<h2 class="when">When do we start? <span>Right away!</span></h2>' +
        '<p class="orig-p">' + p.training + '</p>' +
        '<p class="orig-p">' + PACE + '</p></div>' +
      '<p class="orig-p before">First, here are a few things to do right away:</p>' +
      '<section class="orig-sec"><h2 class="orig-h">Check your email</h2>' +
        '<p class="orig-p">' + emailText(p) + '</p>' + mailId(p) +
        '<p class="orig-p">Follow the instructions in it to log in for the first time. The portal is here: <a href="#">' + p.loginUrl + '</a></p></section>' +
      '<section class="orig-sec"><h2 class="orig-h">Add us to your safe senders</h2>' +
        '<p class="orig-p">Please add yourbestgrade.com to your safe senders, so our emails don’t end up in your spam folder. If the email isn’t in your inbox within 60 minutes, look there, just in case.</p></section>' +
      '<section class="orig-sec"><h2 class="orig-h">Where to get help</h2>' +
        '<p class="orig-p">' + helpText(p) + '</p></section>' +
      '<section class="orig-sec"><h2 class="orig-h">Finally, thank you!</h2>' +
        '<p class="orig-p">' + thanksText(p) + '</p></section>' +
      '<div class="orig-close"><p class="sign">See you inside!</p>' + signImg() +
        '<p class="ps">' + p.ps + '</p></div>' +
    '</article>';
  }

  // Version Sections: the same letter, each part named on the left
  function vLetter(p, card) {
    var img = cardImg(p, card);
    return '<article class="ty v-letter' + (img ? ' has-card' : '') + '">' +
      '<div class="letter-top"><div><h1 class="ty-title">THANK YOU!</h1>' +
      '<p class="ty-lead">' + lead(p) + '</p></div>' + img + '</div>' +
      '<section class="start"><h2 class="when">When do we start? <span>Right away!</span></h2>' +
      '<p class="when-text">' + p.training + ' ' + PACE + '</p></section>' +
      '<div class="parts">' +
        '<section class="part"><h2 class="part-title">Check your email</h2><div class="part-body">' +
          '<p>' + emailText(p) + '</p>' + mailId(p) +
          '<p class="quiet">Not there after 60 minutes? Check your spam folder, and add yourbestgrade.com to your safe senders.</p>' +
        '</div></section>' +
        '<section class="part"><h2 class="part-title">Log in</h2><div class="part-body">' +
          '<p>Follow the instructions in the email to log in for the first time. The portal is here: <a href="#">' + p.loginUrl + '</a></p>' +
        '</div></section>' +
        '<section class="part"><h2 class="part-title">Where to get help</h2><div class="part-body">' +
          '<p>' + helpText(p) + '</p>' +
        '</div></section>' +
      '</div>' +
      '<section class="close" aria-label="A note from Claire">' +
        '<p class="close-text">' + thanksText(p) + '</p>' +
        '<p class="sign">See you inside!</p>' + signImg() +
        '<p class="ps">' + p.ps + '</p>' +
      '</section>' +
    '</article>';
  }

  function page(version, program, card) {
    var p = P[program];
    return header(p) + '<main class="ground">' + (version === 'letter' ? vLetter(p, card) : vOriginal(p, card)) + '</main>' + footer(p);
  }

  function Device(opts) {
    this.kind = opts.kind;
    if (this.kind === 'page') {
      this.el = document.createElement('div');
      this.el.className = 'device device--page';
      this.scroller = document.createElement('div');
      this.scroller.className = 'page-root';
      this.el.appendChild(this.scroller);
      this.el.addEventListener('click', function (e) { if (e.target.closest('a, button')) e.preventDefault(); });
      return;
    }
    var fig = document.createElement('figure');
    fig.className = 'device device--phone';
    this.el = fig;
    var bezel = document.createElement('div');
    bezel.className = 'bezel';
    var screen = document.createElement('div');
    screen.className = 'screen';
    this.scroller = document.createElement('div');
    this.scroller.className = 'scroller is-phone';
    screen.appendChild(this.scroller);
    bezel.appendChild(screen);
    screen.style.width = opts.width + 'px';
    screen.style.height = opts.height + 'px';
    fig.appendChild(bezel);
    var cap = document.createElement('figcaption');
    cap.textContent = opts.width + ' × ' + opts.height;
    fig.appendChild(cap);
    // The mockup does not leave the page: links and buttons inside the screens stay put
    fig.addEventListener('click', function (e) { if (e.target.closest('a, button')) e.preventDefault(); });
  }
  Device.prototype.render = function (version, program, card) { this.scroller.innerHTML = page(version, program, card); };

  function readHash() {
    var out = {};
    location.hash.replace(/^#/, '').split('&').forEach(function (pair) {
      var kv = pair.split('=');
      if (kv[0]) out[kv[0]] = decodeURIComponent(kv[1] || '');
    });
    return out;
  }

  var devices = [];
  function mount() {
    var h = readHash();
    ['program', 'card', 'screen'].forEach(function (k) { if (h[k]) body.dataset[k] = h[k]; });
    if (!cardOf(body.dataset.card)) body.dataset.card = 'light';
    var solo = h.solo === '1' || window.innerWidth < 720;
    body.dataset.solo = solo ? '1' : '0';
    if (solo) body.dataset.screen = 'phone';
    document.querySelectorAll('.mock-seg').forEach(function (seg) {
      seg.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.value === body.dataset[seg.dataset.key])); });
    });
    stage.innerHTML = '';
    devices = [];
    if (solo) {
      var barH = document.querySelector('.mock-bar').offsetHeight;
      devices.push(new Device({ kind: 'phone', width: window.innerWidth, height: window.innerHeight - barH }));
    } else if (body.dataset.screen === 'laptop') {
      devices.push(new Device({ kind: 'page' }));
    } else {
      devices.push(new Device({ kind: 'phone', width: 390, height: PHONE_H }), new Device({ kind: 'phone', width: 446, height: PHONE_H }));
    }
    devices.forEach(function (d) { stage.appendChild(d.el); d.render(body.dataset.version, body.dataset.program, body.dataset.card); });
  }

  function go(key, value) {
    var h = readHash();
    ['program', 'card', 'screen'].forEach(function (k) { if (!h[k]) h[k] = body.dataset[k]; });
    h[key] = value;
    history.replaceState(null, '', '#' + KEYS.filter(function (k) { return h[k]; }).map(function (k) { return k + '=' + h[k]; }).join('&'));
    mount();
  }

  var cardSeg = document.querySelector('.mock-seg[data-key="card"]');
  cardSeg.innerHTML = CARDS.map(function (c) { return '<button data-value="' + c.id + '">' + c.label + '</button>'; }).join('');
  if (CARDS.length < 2) document.querySelector('.mock-group--card').hidden = true;
  document.querySelectorAll('.mock-seg button').forEach(function (b) {
    b.addEventListener('click', function () { go(b.parentElement.dataset.key, b.dataset.value); });
  });
  window.addEventListener('hashchange', mount);
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var soloNow = window.innerWidth < 720 || readHash().solo === '1';
      if (soloNow !== (body.dataset.solo === '1')) mount();
    }, 150);
  });

  var fontsReady = document.fonts && document.fonts.load
    ? Promise.all(['italic 900 44px "Gotham Narrow"', '400 16px Poppins', '500 16px Poppins', '700 16px Poppins'].map(function (f) { return document.fonts.load(f); })).catch(function () {})
    : Promise.resolve();
  fontsReady.then(mount);
})();
</script>
</body>
</html>
