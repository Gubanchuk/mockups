<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Best Grade mockups</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <style>
    :root { --ink: #183261; --link: #1E5290; --ground: #E6EDF6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ground); font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; color: var(--ink); }
    .mk-wrap { max-width: 940px; margin: 0 auto; padding: 56px 20px 80px 20px; }
    .mk-back { margin: 0 0 18px 0; font-size: 13px; }
    .mk-back a { color: var(--link); text-decoration: none; }
    h1 { font-size: 30px; font-weight: 600; margin: 0 0 8px 0; }
    .mk-sub { color: #5a6f92; font-size: 15px; margin: 0 0 34px 0; }
    .mk-card { display: flex; gap: 16px; align-items: flex-start; padding: 20px 22px; margin-bottom: 12px; background: #ffffff; border: 1px solid #d7e0ee; border-radius: 12px; color: inherit; text-decoration: none; }
    .mk-card:hover { border-color: #1E5290; box-shadow: 0 10px 26px rgba(24,50,97,0.12); }
    .mk-num { flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 26px; padding: 0 8px; border-radius: 13px; background: #183261; color: #ffffff; font-size: 13px; font-weight: 600; }
    .mk-card-body { display: block; }
    .mk-card-body b { display: block; font-size: 16px; margin-bottom: 5px; }
    .mk-card-body span { display: block; font-size: 13px; line-height: 1.55; color: #5a6f92; }
    .mk-center { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; max-width: 900px; margin: 0 auto; padding: 48px 20px; }
    .mk-center h1 { text-align: center; }
    .mk-center .mk-sub { text-align: center; }
    .mk-choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .mk-choice .mk-card { flex-direction: column; gap: 10px; min-height: 180px; margin: 0; padding: 28px 28px; }
    .mk-choice .mk-card-body b { font-size: 22px; margin-bottom: 8px; }
    .mk-choice .mk-card-body span { font-size: 14px; }
    .mk-go { margin-top: auto; color: var(--link); font-size: 14px; font-weight: 600; }
    @media (max-width: 640px) { .mk-choice { grid-template-columns: minmax(0, 1fr); } }
  </style>
</head>
<body>
<main class="mk-center">
  <h1>Your Best Grade mockups</h1>
  <p class="mk-sub">Pick a set of mockups.</p>
  <div class="mk-choice">
    <a class="mk-card" href="/a2"><span class="mk-card-body"><b>A2 inside the admin panel</b><span>Five ways the A2 course can live in the current admin panel.</span></span><span class="mk-go">Open &rarr;</span></a>
    <a class="mk-card" href="/affiliate"><span class="mk-card-body"><b>Affiliate program</b><span>The landing page, login and signup, the affiliate dashboard and affiliates in the admin panel.</span></span><span class="mk-go">Open &rarr;</span></a>
  </div>
</main>
</body>
</html>
